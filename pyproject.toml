[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-sft"
version = "1.0.0"
description = "Minimal LoRA SFT pipeline: public reasoning datasets -> Qwen3.5 4B adapter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["llm", "lora", "sft", "fine-tuning", "unsloth", "qwen", "kaggle", "distillation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
kaggle = [
    "unsloth[kaggle-new]",
    "trl>=0.15",
    "datasets",
    "transformers",
    "huggingface_hub",
    "accelerate",
    "bitsandbytes",
]
dev = [
    "pytest>=7",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["qwen_sft*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
